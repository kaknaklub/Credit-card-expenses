<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกค่าใช้จ่ายส่วนตัว</title>
  <!-- SheetJS Library สำหรับสร้างไฟล์ Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary-color: #4E9F3D;
      --primary-light: #E8F5E9;
      --bg-color: #F4F7F6;
      --text-color: #333;
      --border-radius: 12px;
    }

    body {
      font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 25px;
    }

    .control-panel {
      display: flex;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      background-color: var(--primary-light);
      padding: 15px 20px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
    }

    select, button {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button.btn-export {
      background-color: var(--primary-color);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button.btn-export:hover {
      background-color: #3e8230;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: var(--primary-light);
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📊 ระบบบันทึกค่าใช้จ่ายส่วนตัว</h1>

    <div class="control-panel">
      <div>
        <label for="cycleSelect"><strong>เลือก รอบ/รอบบิล:</strong> </label>
        <select id="cycleSelect" onchange="renderTable()">
          <option value="2026-09">รอบ กันยายน 2026</option>
          <option value="2026-10">รอบ ตุลาคม 2026</option>
        </select>
      </div>
      
      <button class="btn-export" onclick="exportStyledExcelWithSheetJS()">
        📥 ส่งออกไฟล์ Excel (สไตล์พาสเทล)
      </button>
    </div>

    <!-- ตารางแสดงผลรายการ -->
    <table id="expenseTable">
      <thead>
        <tr>
          <th>วันที่</th>
          <th>รายการ</th>
          <th>ผู้จ่าย</th>
          <th>ช่องทาง</th>
          <th>หมวดหมู่</th>
          <th>ยอด (บาท)</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- รายการจะถูกแทรกด้วย JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // ตัวอย่างข้อมูล Mock Data (โครงสร้างที่รองรับการผ่อนชำระ)
    let entries = [
      {
        date: "2026-09-05",
        item: "ซื้อของเข้าบ้าน",
        owner: "คุณ",
        method: "Cash",
        category: "ของใช้ในบ้าน",
        amount: 1500,
        repaid: 0,
        note: ""
      },
      {
        date: "2026-09-10",
        item: "โทรศัพท์มือถือใหม่",
        owner: "คุณ",
        method: "CreditCard",
        category: "ไอที",
        amount: 30000,
        isInstallment: true,
        installmentPlan: {
          annualInterest: 0.8, // % ต่อปี
          months: 10,
          schedules: [
            { dueDate: "2026-09-15", amount: 3000, paid: true },
            { dueDate: "2026-10-15", amount: 3000, paid: false }
          ]
        },
        note: "ผ่อน 0.8%"
      }
    ];

    // ฟังก์ชันช่วยจัดรูปแบบวันที่
    function fmtDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      return d.toLocaleDateString("th-TH", { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    // ฟังก์ชันช่วยจัดรูปแบบตัวเลขเงิน
    function money(num) {
      return Number(num || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ฟังก์ชันช่วยดึง Key รอบบิลจากวันที่
    function keyFromDateForMethod(dateStr, method) {
      if (!dateStr) return "";
      return dateStr.substring(0, 7); // คืนค่า YYYY-MM
    }

    // ฟังก์ชันช่วยดึงข้อมูลรายการทั่วไป
    function getEffectiveItemData(item, cycleKey) {
      return {
        amount: item.amount,
        repaid: item.repaid || 0,
        remain: item.amount - (item.repaid || 0)
      };
    }

    // ฟังก์ชันแสดงตารางบนเว็บ
    function renderTable() {
      const k = document.getElementById("cycleSelect").value;
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      entries.forEach(x => {
        let m = x.method || "CreditCard";
        if (x.isInstallment && x.installmentPlan && x.installmentPlan.schedules) {
          x.installmentPlan.schedules.forEach(s => {
            if (keyFromDateForMethod(s.dueDate, m) === k) {
              tbody.innerHTML += `
                <tr>
                  <td>${fmtDate(s.dueDate)}</td>
                  <td>${x.item} <small style="color: green;">[ผ่อนชำระ]</small></td>
                  <td>${x.owner}</td>
                  <td>${x.method}</td>
                  <td>${x.category}</td>
                  <td>${money(s.amount)}</td>
                </tr>`;
            }
          });
        } else {
          if (keyFromDateForMethod(x.date, m) === k) {
            tbody.innerHTML += `
              <tr>
                <td>${fmtDate(x.date)}</td>
                <td>${x.item}</td>
                <td>${x.owner}</td>
                <td>${x.method}</td>
                <td>${x.category}</td>
                <td>${money(x.amount)}</td>
              </tr>`;
          }
        }
      });
    }

    // ==========================================
    // ฟังก์ชันหลัก: ส่งออกไฟล์ Excel (ปรับปรุงใหม่)
    // ==========================================
    function exportStyledExcelWithSheetJS() {
      if (typeof entries === 'undefined' || entries.length === 0) { 
        alert("ไม่มีข้อมูล"); 
        return; 
      } 
      
      const cycleSelectEl = document.getElementById("cycleSelect");
      const k = cycleSelectEl ? cycleSelectEl.value : ""; 
      let flatList = [];
      
      entries.forEach(x => { 
        let m = x.method || "CreditCard";
        if (x.isInstallment && x.installmentPlan && x.installmentPlan.schedules) {
          x.installmentPlan.schedules.forEach(s => { 
            if (keyFromDateForMethod(s.dueDate, m) === k) {
              let instText = " [ผ่อนชำระ]";
              if (x.installmentPlan.annualInterest > 0) {
                let totalInterest = (x.amount * (x.installmentPlan.annualInterest / 100) * (x.installmentPlan.months / 12));
                let interestPerMonth = totalInterest / x.installmentPlan.months;
                instText += ` ดอกเบี้ย ${money(x.installmentPlan.annualInterest)}% ต่อปี (ดอกเบี้ยต่องวด: ฿${money(interestPerMonth)})`;
              }
              flatList.push({ 
                sortDate: s.dueDate, 
                date: fmtDate(s.dueDate), 
                item: `${x.item}${instText}`, 
                owner: x.owner, 
                method: x.method, 
                category: x.category, 
                amount: Number(s.amount), 
                repaid: s.paid ? Number(s.amount) : 0, 
                remain: s.paid ? 0 : Number(s.amount), 
                note: x.note || "" 
              }); 
            }
          });
        } else {
          if (keyFromDateForMethod(x.date, m) === k) { 
            const eff = typeof getEffectiveItemData === 'function' 
              ? getEffectiveItemData(x, k) 
              : { amount: x.amount, repaid: x.repaid || 0, remain: (x.amount - (x.repaid || 0)) }; 
            
            flatList.push({ 
              sortDate: x.date, 
              date: fmtDate(x.date), 
              item: x.item, 
              owner: x.owner, 
              method: x.method, 
              category: x.category, 
              amount: Number(eff.amount), 
              repaid: Number(eff.repaid), 
              remain: Number(eff.remain), 
              note: x.note || "" 
            }); 
          }
        }
      });

      // เรียงลำดับวันที่จากอดีต/ปัจจุบันไปอนาคต (น้อยไปมาก)
      flatList.sort((a, b) => a.sortDate.localeCompare(b.sortDate));

      let wsData = [ 
        ["📊 รายงานสรุปค่าใช้จ่าย"], 
        [], 
        ["วันที่", "รายการ", "ผู้จ่าย", "ช่องทาง", "หมวดหมู่", "ยอด (บาท)", "จ่ายคืน (บาท)", "ค้าง (บาท)", "หมายเหตุ"] 
      ];
      
      flatList.forEach(r => wsData.push([ 
        r.date, r.item, r.owner, r.method, r.category, r.amount, r.repaid, r.remain, r.note 
      ]));

      let wb = XLSX.utils.book_new(); 
      let ws = XLSX.utils.aoa_to_sheet(wsData);
      
      // เปิดใช้งานตัวกรองข้อมูล (AutoFilter) ที่แถวหัวตาราง (แถวที่ 3)
      ws['!autofilter'] = { ref: 'A3:I3' };
      
      XLSX.utils.book_append_sheet(wb, ws, "Report"); 
      XLSX.writeFile(wb, `Report-${k}.xlsx`);
    }

    // แสดงผลข้อมูลตอนโหลดหน้าเว็บครั้งแรก
    window.onload = renderTable;
  </script>
</body>
</html>
